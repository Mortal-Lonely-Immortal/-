# auto-eportal 配置文件
# 至少填好 username 与 pwd 两项，其余保持默认即可。

# 校园网账号 / 密码
username=2021000000
pwd=123456

# 认证页服务器。一般不用改：脚本会先访问 check_url，
# 从网关返回的跳转地址里自动识别真正的认证页主机（含端口）。
portal_host=211.87.158.84
portal_scheme=http

# 服务名／运营商。
# 注意：这里很多门户要填的是"服务代码"，不是界面上显示的中文！
#   例：某校门户下拉框显示「互联网 / 内网（只能访问校内网络）」，
#       实际要填的是 internet / local。
# 不确定就执行 `auto-eportal.sh services`（或电脑上 `python tools/eportal_login.py --services`），
# 它会把门户支持的服务代码列出来。只有单个服务的学校留空即可。
service=internet

# 用来判断"是否已认证"的探测地址。
# 网关会把未认证的请求劫持到认证页，因此这里必须是 http（不能是 https）。
check_url=http://connect.rom.miui.com/generate_204

# 两次检测的间隔（秒）与认证失败后的额外重试次数
poll_interval=10
max_retry=5
